spring.cloud.compatibility-verifier.enabled=false
spring.application.name=gateway
server.port=8222
spring.cloud.config.enabled=false

auth.service.url=${AUTH_SERVICE_URL:http://localhost:4005/auth}

spring.cloud.gateway.routes[0].id=security-service
spring.cloud.gateway.routes[0].uri=${SECURITY_SERVICE_URL:http://localhost:4005}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=task-service
spring.cloud.gateway.routes[1].uri=${TASK_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/task/**
spring.cloud.gateway.routes[1].filters[0]=JwtValidation

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}


