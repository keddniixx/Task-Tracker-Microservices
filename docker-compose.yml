services:
  postgres:
    container_name: psql
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USERNAME: postgres
    networks:
      - task-tracker-net

  postgres-security:
    container_name: db
    image: postgres:latest
    ports:
      - "5001:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USERNAME: postgres
    networks:
      - task-tracker-net

  postgres-notification:
    container_name: exactlyonce
    image: postgres:latest
    ports:
      - "5002:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USERNAME: postgres
    networks:
      - task-tracker-net

  redis:
    container_name: rs
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - task-tracker-net

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - task-tracker-net

  discovery:
    container_name: discovery
    build:
      context: .
      dockerfile: ./discovery/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - task-tracker-net

  security:
    container_name: security
    build:
      context: .
      dockerfile: ./security/Dockerfile
    ports:
      - "4005:4005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-security:5432/postgres
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka/
    depends_on:
      - postgres-security
      - discovery
    networks:
      - task-tracker-net

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8222:8222"
    environment:
      - AUTH_SERVICE_URL=http://security:4005/auth
      - SECURITY_SERVICE_URL=http://security:4005
      - TASK_SERVICE_URL=http://task:8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka/
    depends_on:
      - security
      - discovery
    networks:
      - task-tracker-net

  task:
    container_name: task
    build:
      context: .
      dockerfile: ./task/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka/
    depends_on:
      - postgres
      - redis
      - kafka
      - discovery
    networks:
      - task-tracker-net

  notification:
    container_name: notification
    build:
      context: .
      dockerfile: ./notification/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-notification:5432/postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka/
    depends_on:
      - postgres-notification
      - kafka
      - discovery
    networks:
      - task-tracker-net

  scheduler:
    container_name: scheduler
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - GATEWAY_URL=http://gateway:8222/api/v1/task/summary
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka/
    depends_on:
      - gateway
      - discovery
    networks:
      - task-tracker-net

networks:
  task-tracker-net:
    driver: bridge

volumes:
  redis-data:
